# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - ibas-support-app-17061

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

     steps:
      # Hent koden fra dit repository
      - uses: actions/checkout@v4

      # Sæt .NET 9 op
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      # Gendan NuGet-pakker
      - name: Restore dependencies
        run: dotnet restore ./Server/Server.csproj

      # Byg server-projektet (hvor Blazor-klienten er inkluderet)
      - name: Build Server project
        run: dotnet build ./Server/Server.csproj --configuration Release --no-restore

      # Publicér kun Server-delen til en publish-mappe
      - name: Publish for Azure
        run: dotnet publish ./Server/Server.csproj -c Release -o ./publish

      # Upload artefaktet (det der bliver deployet til Azure)
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish


  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_83E0093763AF4F2EBD8E4F662743004D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F9BCE365901F41F68718F694F3A5DAD4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7F8BEDF5D24A41ECB60C343253B68021 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ibas-support-app-17061'
          slot-name: 'Production'
          package: .

          
